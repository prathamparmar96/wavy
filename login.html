<html>
<head>
	<title>login</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
		
	<div class="logo">
    <img src="wavy-logo.png" alt="Wavy logo">
    <span>Wavy</span>
	</div>
	
	<h1>Welcome back</h1>
	<p>Log in to continue connecting.</p>
	
	<form class="register-form" novalidate>
	<label for="email">Email address</label>
	<input 	type="email" 
			id="email" 	
			name="email" 
			placeholder="you@example.com"
			required>
	<br>
	<label for="password">Password</label>

<div class="password-field">
    <input 	type="password" 
			id="password" 
			name="password"
			placeholder="Enter your password" 
			required>

    <button type="button" 
			class="password-toggle"
            aria-label="Show password"
            aria-pressed="false">Show
    </button>
</div>
	<br>
	<button type="submit" id="login" name="login">Log in</button>
	</form>
	<p>Don't have an account?<a href="Registration.html">Create account</a></p>
<script src="script.js" defer></script>
</body>
</html>
